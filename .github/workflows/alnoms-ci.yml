name: Alnoms CI

on: 
  push:
    branches: [ main ]
  pull_request:

jobs:
  alnoms-guardrail:
    runs-on: ubuntu-latest
    # 🔓 ADD THIS BLOCK TO FIX THE 403 ERROR
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Local Alnoms Action
        uses: ./ 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: 'O(N^3)'